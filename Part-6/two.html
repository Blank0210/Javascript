<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM | Chai aur code</title>
</head>
<body style="background-color: #212121; color: #fff;">
    <div class="parent">
        <!-- this is a comment -->
        <div class="day">Monday</div>
        <div class="day">Tuesday</div>
        <div class="day">Wednesday</div>
        <div class="day">Thursday</div>
    </div>
</body>
<script>
    // Select the element with class 'parent'
    const parent = document.querySelector('.parent')
    // Log the parent div element
    console.log(parent);
    // Log the HTMLCollection of children (divs with class 'day')
    console.log(parent.children);
    // Log the innerHTML of the second child (Tuesday)
    console.log(parent.children[1].innerHTML);

    // Loop through all children of parent and log their innerHTML
    for (let i = 0; i < parent.children.length; i++) {
         console.log(parent.children[i].innerHTML);
        
    }
    // Change the color of the second child to orange (commented out)
    // parent.children[1].style.color = "orange"
    // Log the first child element (Monday)
    console.log(parent.firstElementChild);
    // Log the last child element (Thursday)
    console.log(parent.lastElementChild);

    // Select the first element with class 'day'
    const dayOne = document.querySelector('.day')
    // Log the first 'day' div (Monday)
    console.log(dayOne);
    // Log the parent element of dayOne (should be the parent div)
    console.log(dayOne.parentElement);
    // Log the next sibling element (Tuesday)
    console.log(dayOne.nextElementSibling);

    // Log all child nodes of parent (includes text nodes, comments, etc.)
    console.log("NODES: ", parent.childNodes);
</script>
</html>
